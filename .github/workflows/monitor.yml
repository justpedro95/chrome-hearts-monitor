name: Chrome Hearts Monitor

on:
  schedule:
    # Every 5 minutes - GitHub's minimum for scheduled workflows.
    # GitHub runs these on a best-effort basis; expect occasional drift.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      reseed:
        description: "Re-baseline: forget everything and alert on nothing this run"
        type: boolean
        default: false
permissions:
  contents: write

concurrency:
  group: chrome-hearts-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 matters: the state-push retry rebases, and rebasing on
      # the default shallow clone fails - which turned a lost push race into a
      # failed run and a failure email.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Re-baseline (manual runs only)
        if: inputs.reseed
        run: rm -f state/products.json

      - name: Check Chrome Hearts for new products
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ROLE_MENTION: ${{ vars.ROLE_MENTION }}
          STATE_BACKEND: json
          STATE_JSON: state/products.json
          ALERT_NEW_PRODUCTS: "true"
          ALERT_RESTOCKS: ${{ vars.ALERT_RESTOCKS || 'false' }}
          ALERT_PRICE_CHANGES: ${{ vars.ALERT_PRICE_CHANGES || 'false' }}
          ALERT_NEW_CATEGORIES: ${{ vars.ALERT_NEW_CATEGORIES || 'false' }}
          ENRICH_PRODUCTS: "true"
          HEARTBEAT_HOURS: ${{ vars.HEARTBEAT_HOURS || '12' }}
          REQUEST_DELAY_SECONDS: "1.5"
          LOG_LEVEL: INFO
        run: python monitor.py --once

      - name: Persist state
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain state/)" ]; then
            echo "No catalog change - nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "state: catalog update $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing onto latest..."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || {
              echo "::warning::rebase failed; deferring to the remote state"
              git rebase --abort || true
              git reset --hard "origin/${GITHUB_REF_NAME}"
              exit 0
            }
            sleep $((attempt * 3))
          done
          echo "::error::Could not push state after 5 attempts"
          exit 1
